name: bomcurriculo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atsdatabase}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bomcurriculo

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.3}
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bomcurriculo

  ollama-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.3}
    restart: "no"
    environment:
      OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://ollama:11434}
    command:
      - pull
      - "${OLLAMA_MODEL:-qwen3:4b}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - bomcurriculo

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      RESUME_OUTPUT_LANGUAGE: ${RESUME_OUTPUT_LANGUAGE:-pt-BR}
      RESUME_DOCUMENT_TIMEOUT_SECONDS: ${RESUME_DOCUMENT_TIMEOUT_SECONDS:-10}
      GITHUB_TIMEOUT_SECONDS: ${GITHUB_TIMEOUT_SECONDS:-10}
      RESUME_MAX_SOURCE_CHARACTERS: ${RESUME_MAX_SOURCE_CHARACTERS:-30000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-5}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-2048}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:9000/up
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bomcurriculo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL_CONNECT: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bomcurriculo

networks:
  bomcurriculo:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
  ollama_data:
