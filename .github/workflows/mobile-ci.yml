name: Mobile CI

on:
  push:
    branches: [development]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [development]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  # Allows the autofix workflow to re-run these checks after committing
  # a fix (a push made with GITHUB_TOKEN doesn't trigger pull_request
  # again, but workflow_dispatch is an exception to that rule).
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
