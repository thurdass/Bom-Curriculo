name: Autofix (Pint / dart format)

# Runs with write permissions and no fork secrets: only accepts PRs from the
# repository itself (including dependabot). Uses pull_request_target to be
# able to push back to the PR branch even when it came in with a read-only
# GITHUB_TOKEN (the case for dependabot on a regular pull_request).
#
# Push with an app identity (recommended): if the AUTOFIX_APP_ID and
# AUTOFIX_APP_PRIVATE_KEY secrets exist (a GitHub App installed on the repo
# with content permission), the push uses the app's token. Runs triggered by
# an installed app don't fall under the manual-approval requirement that
# GITHUB_TOKEN sometimes triggers, so the real checks (Pint --test,
# flutter analyze, flutter test) re-run automatically on the fixed commit.
# See the repo README / instructions sent to the owner to create the app
# and secrets.
#
# Fallback without an app configured: push with the default GITHUB_TOKEN
# (which does not trigger pull_request again) + an explicit workflow_dispatch
# right after to run Backend CI / Mobile CI on the fixed commit. This works,
# but may end up pending manual approval depending on the repo/org's
# Actions policy.
on:
  pull_request_target:
    branches: [development]
    paths:
      - "backend/**"
      - "mobile/**"

permissions:
  contents: write
  actions: write

jobs:
  backend-pint:
    name: Autofix backend (Pint)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Generate GitHub App token (if configured)
        id: app-token
        if: ${{ vars.AUTOFIX_APP_ID != '' && secrets.AUTOFIX_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint (fix)
        run: vendor/bin/pint

      - name: Commit and push fixes
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(backend): apply Pint automatically"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to fix."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger Backend CI on the fixed commit (fallback without app)
        if: steps.commit.outputs.pushed == 'true' && steps.app-token.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backend-ci.yml --ref "${{ github.event.pull_request.head.ref }}"

  mobile-dart:
    name: Autofix mobile (dart format)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Generate GitHub App token (if configured)
        id: app-token
        if: ${{ vars.AUTOFIX_APP_ID != '' && secrets.AUTOFIX_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run dart fix (safe fixes)
        run: dart fix --apply

      - name: Run dart format
        run: dart format .

      - name: Commit and push fixes
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(mobile): apply dart fix and dart format automatically"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to fix."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger Mobile CI on the fixed commit (fallback without app)
        if: steps.commit.outputs.pushed == 'true' && steps.app-token.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-ci.yml --ref "${{ github.event.pull_request.head.ref }}"
